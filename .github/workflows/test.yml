name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------- Python
  python:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        working-directory: python
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Test
        working-directory: python
        run: pytest -m "not slow" --cov=distributed_mpc_admm --cov-report=xml

      - name: Upload coverage
        if: matrix.python-version == '3.13'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: python/coverage.xml

  # ---------------------------------------------------------------- lint
  lint:
    name: ruff + black + mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install
        working-directory: python
        run: pip install -e ".[dev]"

      - name: ruff
        working-directory: python
        run: ruff check .

      - name: black
        working-directory: python
        run: black --check .

      - name: mypy
        working-directory: python
        run: mypy distributed_mpc_admm

  # ---------------------------------------------------------------- notebooks
  notebooks:
    name: notebook smoke test
    runs-on: ubuntu-latest
    # Notebooks are slow and are not a correctness gate; keep them off the PR critical path.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install
        working-directory: python
        run: pip install -e ".[dev]"

      # TODO(deepseek §14.4): nbmake runs every notebook end to end. If 04 and 05 exceed the
      # runner budget, add a NB_CI=1 env check inside those notebooks that shrinks the
      # sweep sizes -- do NOT drop them from CI. A notebook that is not executed in CI is
      # a notebook that is broken and nobody knows it.
      - name: Execute notebooks
        working-directory: python
        run: pytest --nbmake --nbmake-timeout=900 notebooks/

  # ---------------------------------------------------------------- C++ / ROS 2
  colcon:
    name: colcon build + test (ROS 2 Lyrical Luth)
    runs-on: ubuntu-latest
    container:
      image: ros:lyrical-ros-base

    steps:
      - uses: actions/checkout@v4
        with:
          path: src/distributed-mpc-admm

      - name: Install dependencies
        shell: bash
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential cmake git python3-colcon-common-extensions \
            libeigen3-dev libzmq3-dev python3-vcstool
          rosdep update
          rosdep install --from-paths src --ignore-src -y --rosdistro lyrical || true

      # TODO(deepseek §14.3): osqp_vendor may not resolve on every distro. If rosdep fails,
      # build OSQP from source here (git clone --recursive, cmake -DCMAKE_INSTALL_PREFIX
      # =/usr/local, make install) and drop the `|| true` above -- a silently skipped
      # dependency install turns into a confusing link error three steps later.

      - name: Build
        shell: bash
        run: |
          source /opt/ros/lyrical/setup.bash
          colcon build --packages-select cpp_admm --cmake-args -DCMAKE_BUILD_TYPE=Release

      - name: Test
        shell: bash
        run: |
          source /opt/ros/lyrical/setup.bash
          colcon test --packages-select cpp_admm --event-handlers console_direct+
          colcon test-result --verbose

  # ---------------------------------------------------------------- LaTeX
  docs:
    name: build derivations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # TODO(deepseek §14.6): compile each .tex with latexmk and upload the PDFs as an
      # artifact. Failing this job on a LaTeX error is correct -- a repo whose headline
      # deliverable is a set of derivations must not ship documents that do not compile.
      - name: latexmk
        uses: xu-cheng/latex-action@v3
        with:
          root_file: |
            docs/derivations/augmented_lagrangian.tex
            docs/derivations/consensus_admm_derivation.tex
            docs/derivations/convergence_proof.tex
          latexmk_use_lualatex: false
          continue_on_error: false

      - uses: actions/upload-artifact@v4
        with:
          name: derivations-pdf
          path: docs/derivations/*.pdf
