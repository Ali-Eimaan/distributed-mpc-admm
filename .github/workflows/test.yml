name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# One place for the distro name (used in every shell step below). The container image
# tag is literal because the `env` context is not available in `jobs.<job_id>.container`.
env:
  ROS_DISTRO: lyrical

jobs:
  # ---------------------------------------------------------------- Python
  python:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        working-directory: python
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Test
        working-directory: python
        run: pytest -m "not slow" --cov=distributed_mpc_admm --cov-report=xml

      - name: Upload coverage
        if: matrix.python-version == '3.13'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: python/coverage.xml

  # ---------------------------------------------------------------- lint
  lint:
    name: ruff + black + mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install
        working-directory: python
        run: pip install -e ".[dev]"

      - name: ruff
        working-directory: python
        run: ruff check .

      - name: black
        working-directory: python
        run: black --check .

      - name: mypy
        working-directory: python
        run: mypy distributed_mpc_admm

  # ---------------------------------------------------------------- notebooks
  notebooks:
    name: notebook smoke test
    runs-on: ubuntu-latest
    # Notebooks are slow and are not a correctness gate; keep them off the PR critical path.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install
        working-directory: python
        run: pip install -e ".[dev]"

      # nbmake runs every notebook end to end. If 04/05 exceed the runner budget, add an
      # NB_CI=1 env check inside those notebooks that shrinks the sweep sizes -- do NOT
      # drop them from CI. A notebook not executed in CI is one that is broken and nobody knows.
      - name: Execute notebooks
        working-directory: python
        run: pytest --nbmake --nbmake-timeout=900 notebooks/

      # The three analysis/ notebooks read cached .npz logs and are fast; run them too.
      - name: Execute analysis notebooks
        run: pytest --nbmake --nbmake-timeout=600 analysis/

  # ---------------------------------------------------------------- C++ / ROS 2
  colcon:
    name: colcon build + test (ROS 2 Lyrical Luth)
    runs-on: ubuntu-latest
    container:
      image: ros:lyrical-ros-base

    steps:
      - uses: actions/checkout@v4
        with:
          path: src/distributed-mpc-admm

      - name: Install dependencies
        shell: bash
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential cmake git python3-colcon-common-extensions \
            libeigen3-dev libzmq3-dev cppzmq-dev nlohmann-json3-dev python3-vcstool
          rosdep update
          # osqp_vendor is skipped explicitly (risk V9): OSQP is built from source below
          # at a pinned tag. No `|| true` -- a silently skipped dependency turns into a
          # confusing link error three steps later.
          rosdep install --from-paths src --ignore-src -y --rosdistro "$ROS_DISTRO" --skip-keys osqp_vendor

      # OSQP 1.x (pinned, tag v1.0.0) is not reliably published as osqp_vendor for
      # Lyrical, so build it from source into /usr/local. The tag is the pin; `main` is not.
      - name: Build OSQP from source
        shell: bash
        run: |
          git clone --recursive --branch v1.0.0 --depth 1 https://github.com/osqp/osqp.git /tmp/osqp
          cmake -S /tmp/osqp -B /tmp/osqp/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr/local \
            -DOSQP_BUILD_SHARED_LIB=ON
          cmake --build /tmp/osqp/build --target install -j"$(nproc)"
          # /usr/local/lib is on the default search path but the cache is not refreshed by
          # `make install`. Without this, the library links fine and then the gtest binary
          # dies at startup with "libosqp.so: cannot open shared object file", which
          # presents as a test failure rather than as a missing dependency.
          ldconfig

      - name: Build
        shell: bash
        run: |
          source /opt/ros/$ROS_DISTRO/setup.bash
          # -DBUILD_TESTING=ON is required: without it the gtest target is never
          # configured and `colcon test` below reports test_admm_kernel as "Not Run"
          # rather than running it, so A7 would silently go unverified.
          colcon build --packages-select cpp_admm \
            --cmake-args -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON

      - name: Test
        shell: bash
        run: |
          source /opt/ros/$ROS_DISTRO/setup.bash
          colcon test --packages-select cpp_admm --return-code-on-test-failure --event-handlers console_direct+
          colcon test-result --verbose

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: colcon-test-results
          path: build/cpp_admm/test_results/

  # ---------------------------------------------------------------- LaTeX
  docs:
    name: build derivations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # latexmk (multiple passes + bibtex, -halt-on-error via continue_on_error: false) over
      # each derivation. Failing this job on a LaTeX error is correct -- a repo whose headline
      # deliverable is a set of derivations must not ship documents that do not compile.
      - name: latexmk
        uses: xu-cheng/latex-action@v3
        with:
          root_file: |
            docs/derivations/augmented_lagrangian.tex
            docs/derivations/consensus_admm_derivation.tex
            docs/derivations/convergence_proof.tex
          latexmk_use_lualatex: false
          continue_on_error: false

      - uses: actions/upload-artifact@v4
        with:
          name: derivations-pdf
          path: docs/derivations/*.pdf
          if-no-files-found: error
